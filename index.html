<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk · Time Clock</title><meta name="theme-color" content="#3b8de3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"></head>
<body><div class="login"><div class="lg"></div><h1 id="jd">Masuk</h1><p class="mut" id="sub">Time Sheet Tim · Cible & Numa_HDe</p>
<label>Nama</label><input id="nama" autocomplete="username" placeholder="Nama lengkap"><div id="dx" style="display:none"><label>Posisi</label><input id="posisi" placeholder="Contoh: Produksi"></div>
<label>Password</label><input id="pw" type="password" autocomplete="current-password"><div id="dy" style="display:none"><label>Ulangi password</label><input id="pw2" type="password"></div>
<p class="err" id="er"></p><button class="p" id="go">Masuk</button><button class="lk" id="sw">Belum punya akun? Daftar</button></div><div id="toast"></div>
<script src="config.js"></script><script src="common.js"></script><script>
const u0=S.get();if(u0)location.replace(u0.role==='admin'?'admin.html':'karyawan.html');
let reg=false;
$('#sw').onclick=()=>{reg=!reg;$('#jd').textContent=reg?'Daftar':'Masuk';$('#go').textContent=reg?'Daftar':'Masuk';$('#dx').style.display=$('#dy').style.display=reg?'block':'none';$('#sw').textContent=reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar';$('#sub').textContent=reg?'Pemilik: daftar dengan nama "admin".':'Time Sheet Tim · Cible & Numa_HDe';$('#er').textContent=''};
$('#go').onclick=async()=>{const p={nama:$('#nama').value.trim(),password:$('#pw').value,posisi:$('#posisi').value.trim()};const e=$('#er');e.textContent='';
 if(!p.nama||!p.password){e.textContent='Nama dan password wajib diisi.';return}
 if(reg&&p.password!==$('#pw2').value){e.textContent='Password tidak sama.';return}
 const b=$('#go');b.disabled=true;
 try{const u=await call(reg?'ts.register':'ts.login',p);S.set(u);location.replace(u.role==='admin'?'admin.html':'karyawan.html')}catch(x){e.textContent=x.message;b.disabled=false}};
document.addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
</script></body></html>
