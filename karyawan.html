<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Time Clock</title><meta name="theme-color" content="#3b8de3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="karyawan.css"></head><body>
<div class="app">
<div><header class="bar"><span class="sp"></span><h1>Time Clock</h1><button class="ib" onclick="logout()" aria-label="Keluar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></header>
<section class="info"><div class="av" id="av"></div><div class="nm"><b id="nm"></b><span id="ps"></span></div><time id="clk">00:00:00</time>
<div class="dt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg><span id="dt"></span></div></section></div>
<div class="mid"><div class="gw"><button class="go" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v4l2.5 1.5M9.5 3h5M12 3v3.5"/></svg><span id="gl">Mulai kerja</span><small id="gs">00:00:00</small></button><span class="pulse"></span><div class="chip" id="info"><i></i><span id="it"></span></div></div></div>
<div class="tiles"><button class="tile" id="t1"><i class="ia"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></i>Isi agenda & bukti</button>
<button class="tile" id="t2"><i class="ib2"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h3"/></svg></i>Timesheet saya</button></div></div>
<section class="pg" id="pf"><header class="bar"><button class="ib" data-x="pf" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="ft">Agenda & bukti</h1><span class="sp"></span></header><div class="pc">
<p class="mut" id="hint"></p><div class="tf fl"><input id="tgl" type="date"><label>Tanggal</label></div>
<div class="row"><div class="tf fl"><input id="dari" type="time"><label>Jam dari</label></div><div class="tf fl"><input id="sampai" type="time"><label>Jam sampai</label></div></div>
<div class="tf"><textarea id="agenda" placeholder=" "></textarea><label>Agenda kegiatan / kerja</label></div><div class="tf"><textarea id="hasil" placeholder=" "></textarea><label>Hasil / keluaran</label></div>
<label class="btn s add"><input id="foto" type="file" accept="image/*" multiple hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Tambah foto bukti</label><div class="th" id="pv"></div>
<p class="err" id="er"></p><button class="btn p" id="simpan">Simpan</button></div></section>
<section class="pg" id="pw"><header class="bar"><button class="ib" data-x="pw" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1>Timesheet saya</h1><span class="sp"></span></header><div class="pc">
<div class="seg" id="sg"><button data-m="w" class="on">Mingguan</button><button data-m="m">Bulanan</button><button data-m="y">Tahunan</button></div>
<div class="wk"><button class="ib" data-w="-1" aria-label="Sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><b id="rwk"></b><button class="ib" data-w="1" aria-label="Berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button></div><div class="chips" id="rtot"></div><div id="bd"></div><div id="rl"></div></div></section>
<div id="toast"></div><script src="config.js"></script><script src="common.js"></script><script>
const U=guard(false);let edit=null,fotos=[],hapus=[],RM='w',RA=ymd(new Date()),rows=[];
const run=()=>JSON.parse(localStorage.getItem('ts_run')||'null'),pend=()=>JSON.parse(localStorage.getItem('ts_pend')||'null');
$('#nm').textContent=U.nama;$('#ps').textContent=U.posisi||'Karyawan';$('#av').textContent=U.nama[0].toUpperCase();
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.go,.tile,.btn,.ib');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),600)});
function tick(){const n=new Date();$('#clk').textContent=n.toTimeString().slice(0,8);$('#dt').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const r=run();if(r){const s=Math.floor((n-r.start)/1000);$('#gs').textContent=[s/3600|0,s/60%60|0,s%60].map(p2).join(':')}}
function paint(){const r=run();$('#go').classList.toggle('on',!!r);$('#gl').textContent=r?'Selesai':'Mulai kerja';$('#info').classList.toggle('on',!!r);
 $('#it').textContent=r?'Bekerja sejak '+hm(new Date(r.start)):pend()?'Sesi selesai, agenda belum diisi':'Belum mulai';tick()}
$('#go').onclick=()=>{const r=run();
 if(!r){if(pend()&&!confirm('Sesi sebelumnya belum disimpan. Mulai sesi baru dan buang yang lama?'))return;localStorage.removeItem('ts_pend');localStorage.setItem('ts_run',JSON.stringify({start:Date.now()}));paint();return}
 const a=new Date(r.start),b=new Date();localStorage.removeItem('ts_run');localStorage.setItem('ts_pend',JSON.stringify({tanggal:ymd(a),dari:hm(a),sampai:ymd(a)===ymd(b)?hm(b):'23:59'}));paint();openForm()};
const show=id=>$('#'+id).classList.add('on');$$('[data-x]').forEach(b=>b.onclick=()=>$('#'+b.dataset.x).classList.remove('on'));
function pv(old=[]){$('#pv').innerHTML=old.map(i=>`<div class="x"><img src="https://drive.google.com/thumbnail?id=${i}&sz=w200"><i data-o="${i}">×</i></div>`).join('')+fotos.map((f,n)=>`<div class="x"><img src="${f.src}"><i data-n="${n}">×</i></div>`).join('');
 $$('#pv i').forEach(x=>x.onclick=()=>{if(x.dataset.o){hapus.push(x.dataset.o);edit.sisa=edit.sisa.filter(z=>z!==x.dataset.o)}else fotos.splice(+x.dataset.n,1);pv(edit?edit.sisa:[])})}
$('#foto').onchange=async e=>{for(const f of e.target.files)fotos.push(await shrink(f));e.target.value='';pv(edit?edit.sisa:[])};
function openForm(r){edit=r?{id:r.id,sisa:idsOf(r)}:null;fotos=[];hapus=[];const p=pend();$('#er').textContent='';
 $('#tgl').value=r?r.tanggal:p?p.tanggal:ymd(new Date());$('#dari').value=r?r.jam_dari:p?p.dari:'';$('#sampai').value=r?r.jam_sampai:p?p.sampai:'';
 $('#agenda').value=r?r.agenda:'';$('#hasil').value=r?r.hasil:'';$('#ft').textContent=r?'Ubah kegiatan':'Agenda & bukti';
 $('#hint').textContent=r?'':p?'Jam terisi otomatis dari tombol waktu.':'Belum ada sesi berjalan, jam bisa diisi manual.';pv(edit?edit.sisa:[]);show('pf')}
$('#t1').onclick=()=>openForm();
$('#simpan').onclick=async()=>{const b=$('#simpan'),p={posisi:U.posisi,tanggal:$('#tgl').value,jam_dari:$('#dari').value,jam_sampai:$('#sampai').value,agenda:$('#agenda').value.trim(),hasil:$('#hasil').value.trim(),photos:fotos.map(f=>({mime:f.mime,data:f.data}))};
 if(!p.tanggal||!p.jam_dari||!p.jam_sampai||!p.agenda){$('#er').textContent='Tanggal, jam, dan agenda wajib diisi.';return}
 b.disabled=true;b.textContent=fotos.length?'Mengunggah foto…':'Menyimpan…';$('#er').textContent='';
 try{if(edit){p.id=edit.id;p.remove_ids=hapus;await call('ts.update',p)}else await call('ts.add',p);
  if(!edit)localStorage.removeItem('ts_pend');paint();$('#pf').classList.remove('on');toast('Tersimpan');if($('#pw').classList.contains('on'))loadRiw()}
 catch(e){$('#er').textContent='Gagal: '+e.message+'. Isi form masih ada, coba lagi.'}b.disabled=false;b.textContent='Simpan'};
const card=r=>`<div class="card"><b>${esc(r.hari)}, ${shortD(r.tanggal)}</b> <span class="mut">${esc(r.jam_dari)}–${esc(r.jam_sampai)} (${r.durasi_jam} jam)</span><div>${esc(r.agenda)}</div><div class="mut">${esc(r.hasil)}</div><div class="th">${thumbs(idsOf(r))}</div><div style="margin-top:10px;display:flex;gap:8px"><button class="btn s" data-e="${r.id}">Ubah</button><button class="btn s" data-d="${r.id}">Hapus</button></div></div>`;
async function loadRiw(){const R=pRange(RM,RA);$('#rwk').textContent=R.label;$$('#sg button').forEach(b=>b.classList.toggle('on',b.dataset.m===RM));$('#rl').innerHTML='<p class="mut">Memuat…</p>';$('#bd').innerHTML='';
 try{rows=await loadPeriode(RM,RA);const A=agg(rows);
  $('#rtot').innerHTML=`<span>Total ${A.jam.toFixed(1)} jam</span><span>${A.n} kegiatan</span><span>${A.hari} hari kerja</span><span>Rata-rata ${(A.hari?A.jam/A.hari:0).toFixed(1)} jam/hari</span>`;
  if(RM!=='w'&&rows.length)$('#bd').innerHTML=breakdown(RM,rows);
  $('#rl').innerHTML=RM==='y'?'':rows.length?rows.map(card).join(''):'<p class="mut">Belum ada kegiatan pada periode ini.</p>';
  bindDrill((m,a)=>{RM=m;RA=a;loadRiw()});
  $$('[data-e]').forEach(b=>b.onclick=()=>openForm(rows.find(x=>x.id===b.dataset.e)));
  $$('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus kegiatan ini?')){try{await call('ts.delete',{id:b.dataset.d});toast('Dihapus');loadRiw()}catch(e){toast(e.message)}}})
 }catch(e){$('#rl').innerHTML='<p class="err">Gagal memuat: '+esc(e.message)+'</p>'}}
$('#t2').onclick=()=>{show('pw');loadRiw()};
$$('#sg button').forEach(b=>b.onclick=()=>{RM=b.dataset.m;loadRiw()});
$$('#pw .wk button').forEach(b=>b.onclick=()=>{RA=pMove(RM,RA,+b.dataset.w);loadRiw()});
paint();setInterval(tick,1000);
</script></body></html>
